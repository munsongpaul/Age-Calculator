<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="Free, fast, and precise online Age Calculator. Calculate your age in years, months, days, and total weeks lived.">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Exact Age Calculator - Precise Date Tool</title>
    <style>
        body {font-family: 'Segoe UI', sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; color: #333; }
        .container {max-width: 600px; background: #fff; margin: 40px auto; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); text-align: center; }
        input[type="date"] {width: 80%; padding: 12px; font-size: 16px; border: 2px solid #3498db; border-radius: 6px; margin-bottom: 20px; }
        .calc-btn {background-color: #3498db; color: white; padding: 12px 30px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .result-box {margin-top: 30px; padding: 20px; background: #fdfdfd; border-radius: 8px; border-left: 5px solid #2ecc71; text-align: left; display: none; }
        .footer-link { margin-top: 40px; font-size: 14px; color: #666; }
    </style>
</head>
<body>

<div class="container">
    <h1>Exact Age Calculator</h1>
    <input type="date" id="birthdate">
    <br>
    <button class="calc-btn" onclick="calculateAge()">Calculate Age</button>

    <div class="result-box" id="resultBox">
        <div id="yearsResult">Years: <span></span></div>
        <div id="monthsResult">Months: <span></span></div>
        <div id="daysResult">Days: <span></span></div>
        <div id="weeksResult">Total Weeks Lived: <span></span></div>
        <div id="dayBorn">You were born on a: <span></span></div>
    </div>
</div>

<div class="footer-link">
    Need more tools? Try our <a href="https://pdftextextractor.vercel.app/" target="_blank">PDF Text Extractor</a>
</div>

<script>
function calculateAge() {
    const val = document.getElementById('birthdate').value;
    if (!val) return;
    const bday = new Date(val);
    const now = new Date();
    
    let years = now.getFullYear() - bday.getFullYear();
    let months = now.getMonth() - bday.getMonth();
    let days = now.getDate() - bday.getDate();
    if (days < 0) { months--; days += 30; }
    if (months < 0) { years--; months += 12; }

    const totalDays = Math.floor((now - bday) / (1000 * 60 * 60 * 24));
    const dayNames = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
    
    document.getElementById('yearsResult').querySelector('span').innerText = years;
    document.getElementById('monthsResult').querySelector('span').innerText = months;
    document.getElementById('daysResult').querySelector('span').innerText = days;
    document.getElementById('weeksResult').querySelector('span').innerText = Math.floor(totalDays/7);
    document.getElementById('dayBorn').querySelector('span').innerText = dayNames[bday.getDay()];
    document.getElementById('resultBox').style.display = 'block';
}
</script>
</body>
</html>
